<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%233b82f6%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22Arial%22 font-weight=%22bold%22 font-size=%2236%22>M</text></svg>">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momento</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; }
    .container { max-width: 760px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 16px; }
    .card { width: 100%; box-sizing: border-box; background: #121212; border: 1px solid #262626; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; box-sizing: border-box; }
    button { background: #0095f6; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #1877f2; }
    .row { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #e1306c; background: #262626; }
    .stories { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .story-item { text-align: center; min-width: 72px; }
    .story-item img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid #e1306c; }
    .post-img { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 450px; object-fit: cover; }
    .hidden { display: none; }
    .status { font-size: 13px; color: #00e676; margin-top: 6px; }
    :root { --aura-color: #38bdf8; }
  #userDp {
    border: 3px solid var(--aura-color) !important;
    box-shadow: 0 0 18px var(--aura-color), 0 0 6px var(--aura-color) !important;
    transition: all 0.35s ease;
  }
  .mood-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .mood-btn {
    width: auto !important; padding: 5px 10px !important; font-size: 12px !important;
    border-radius: 999px !important; background: #1e1e24 !important;
    border: 1px solid #333 !important; color: #fff !important; cursor: pointer;
  }
  .mood-btn:hover { border-color: var(--aura-color) !important; transform: translateY(-1px); }
    @keyframes heartPop {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      35% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
    }
    .heart-burst {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 74px;
      pointer-events: none;
      animation: heartPop 0.75s ease forwards;
      filter: drop-shadow(0 0 18px rgba(236,72,153,0.9));
      z-index: 20;
    }
    body { background: #070b14 !important; }
    /* EXACT MOCKUP PROFILE STYLING */
    .profile-shell > .card > .row:first-child {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      width: 100% !important;
    }
    .profile-shell > .card > .row:first-child > .btn-edit-pill {
      margin-left: auto !important;
    }
    .profile-shell {
      background: #0d121f !important;
      border: 1px solid #1c253b !important;
      border-radius: 18px !important;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    #profileCoverBanner {
      height: 155px !important;
      background: radial-gradient(circle at 75% 35%, rgba(16, 185, 129, 0.55), transparent 55%),
                  radial-gradient(circle at 20% 25%, rgba(56, 189, 248, 0.55), transparent 50%),
                  linear-gradient(120deg, #0c1938 0%, #0a2e38 55%, #071921 100%) !important;
      position: relative;
    }
    .profile-shell > .card {
      background: transparent !important;
      border: none !important;
      padding: 0 22px 22px !important;
      margin: 0 !important;
    }
    .profile-top-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: -44px;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    #userDp {
      width: 96px !important;
      height: 96px !important;
      border: 3px solid #38bdf8 !important;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.65), inset 0 0 12px rgba(56, 189, 248, 0.4) !important;
      margin-top: 0 !important;
    }
    .btn-edit-pill {
      width: auto !important;
      margin: 0 !important;
      background: #141c2f !important;
      border: 1px solid #283554 !important;
      color: #e2e8f0 !important;
      border-radius: 10px !important;
      padding: 8px 16px !important;
      font-size: 13px !important;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-edit-pill:hover {
      border-color: #38bdf8 !important;
      background: #1a243d !important;
    }
    #momentoFollowStats {
      gap: 12px !important;
      margin-top: 14px !important;
    }
    #momentoFollowStats > div {
      background: #111726 !important;
      border: 1px solid #1e2942 !important;
      border-radius: 12px !important;
      padding: 14px 10px !important;
      transition: 0.2s;
    }
    #momentoFollowStats > div:hover {
      border-color: #38bdf8 !important;
    }
    .btn-photo-bar {
      width: 100% !important;
      margin: 12px 0 0 0 !important;
      background: #111726 !important;
      border: 1px solid #1e2942 !important;
      color: #60a5fa !important;
      border-radius: 11px !important;
      padding: 10px !important;
      font-size: 13px !important;
    }
    .duo-mem-split {
      display: grid;
      grid-template-columns: 1fr 165px;
      gap: 12px;
      margin-top: 14px;
    }
    @media (max-width: 640px) {
      .duo-mem-split { grid-template-columns: 1fr; }
    }
    #friendLinkBox {
      display: block !important;
      background: #111726 !important;
      border: 1px solid #1e2942 !important;
      border-radius: 14px !important;
      padding: 14px !important;
      margin: 0 !important;
    }
    #memoriesSection {
      background: #111726 !important;
      border: 1px solid #1e2942 !important;
      border-radius: 14px !important;
      padding: 14px !important;
      margin: 0 !important;
    }
    #profileContentTabs button {
      border-radius: 999px !important;
      padding: 10px 16px !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      transition: 0.2s;
    }
    #pTabPosts {
      background: linear-gradient(135deg, #172554, #1e40af) !important;
      border: 1px solid #3b82f6 !important;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.35);
      color: #fff !important;
    }
    #pTabReels, #pTabTagged {
      background: #111726 !important;
      border: 1px solid #1e2942 !important;
      color: #94a3b8 !important;
    }
    .empty-posts-card {
      background: #0d121f;
      border: 1px solid #1c253b;
      border-radius: 16px;
      padding: 44px 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .profile-shell {
      background: #111625;
      border: 1px solid #1e263d;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    #profileCoverBanner {
      margin: 0 !important;
      height: 145px !important;
      border-radius: 0 !important;
      background: linear-gradient(115deg, #1d4ed8 0%, #0d9488 55%, #064e3b 100%) !important;
      -webkit-mask-image: none !important;
      mask-image: none !important;
    }
    .profile-shell > .card {
      background: transparent !important;
      border: none !important;
      margin-bottom: 0 !important;
      padding-top: 0 !important;
    }
    #userDp {
      width: 84px !important;
      height: 84px !important;
      margin-top: -38px !important;
    }
    #momentoFollowStats > div {
      background: #0b0f19 !important;
      border-color: #1e263d !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="text-align:center;">Momento</h1>

    <!-- Auth Section -->
    <div id="authBox" class="card">
      <h3>Login or Create Account</h3>
      <input id="username" placeholder="Username (for signup)" />
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button onclick="auth('/api/login/')">Log In</button>
      <button style="background:#333;" onclick="auth('/api/signup/')">Sign Up</button>
      <p id="authMsg" class="status"></p>
    </div>

    <!-- Main App Section -->
    <div id="appBox" class="hidden" style="padding-bottom:76px;">
      <div class="profile-shell">
<div id="profileCoverBanner" style="position:relative;height:185px;margin:-20px -20px -102px -20px;border-radius:14px 14px 0 0;background:radial-gradient(circle at 20% 20%,rgba(29,78,216,0.55),transparent 65%),radial-gradient(circle at 85% 30%,rgba(16,185,129,0.45),transparent 60%),linear-gradient(180deg,rgba(15,23,42,0.85) 0%,rgba(22,22,26,0) 100%);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,1) 35%,rgba(0,0,0,0) 100%);mask-image:linear-gradient(to bottom,rgba(0,0,0,1) 35%,rgba(0,0,0,0) 100%);pointer-events:auto;">
        <input type="file" id="coverPhotoInput" accept="image/*" style="display:none;" onchange="handleCoverUpload(event)" />
        <button type="button" onclick="document.getElementById('coverPhotoInput').click()" style="position:absolute;top:10px;right:10px;width:auto;margin:0;padding:4px 9px;font-size:11px;border-radius:8px;background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.2);color:#fff;cursor:pointer;">&#128247; Cover</button>
      </div>
      <!-- Profile & Change DP -->
      <div class="card">
        <div class="row">
        <div style="position:relative;display:inline-block;cursor:pointer;" onclick="openMyStory()">
          <img id="userDp" class="avatar" src="" style="transition:0.25s;" />
        <img id="friendDpBadge" src="" title="Linked Friend" style="display:none;width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--aura-color,#00d2ff);margin-left:-14px;box-shadow:0 0 12px rgba(0,210,255,0.45);vertical-align:bottom;" />
          <span onclick="event.stopPropagation();document.getElementById('storyInput').click();" title="Add to your story" style="position:absolute;bottom:2px;right:2px;width:22px;height:22px;border-radius:50%;background:#0095f6;color:#fff;font-weight:bold;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid #16161a;">+</span>
        </div>
          <div>
            <strong id="displayUser"></strong>
        <div style="font-size:12px;color:#aaa;" id="displayEmail"></div>
        <div id="displayBio" style="font-size:13px;color:#e5e7eb;margin-top:4px;white-space:pre-line;"></div>
          <div id="displayLocation" onclick="detectUserLocation(true)" title="Click to refresh exact location" style="font-size:12px;color:#60a5fa;margin-top:4px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;"><span>&#128205;</span><span id="locationText">Detecting location...</span></div>
      </div>
          <button type="button" onclick="openEditModal()" class="btn-edit-pill">&#9998; Edit Profile</button>
    </div>
            <div id="momentoFollowStats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;text-align:center;">
          <div onclick="openFollowModal('followers')" style="cursor:pointer;background:#16161d;border:1px solid #282834;border-radius:12px;padding:12px 8px;">
            <div id="statFollowersCount" style="font-size:18px;font-weight:700;color:#fff;">0</div>
            <div style="font-size:12px;color:#9ca3af;margin-top:2px;">Followers</div>
          </div>
          <div onclick="openFollowModal('following')" style="cursor:pointer;background:#16161d;border:1px solid #282834;border-radius:12px;padding:12px 8px;">
            <div id="statFollowingCount" style="font-size:18px;font-weight:700;color:#fff;">0</div>
            <div style="font-size:12px;color:#9ca3af;margin-top:2px;">Following</div>
          </div>
          <div onclick="openFollowModal('discover')" style="cursor:pointer;background:#16161d;border:1px solid #282834;border-radius:12px;padding:12px 8px;">
            <div style="font-size:18px;font-weight:700;color:#60a5fa;">+</div>
            <div style="font-size:12px;color:#60a5fa;font-weight:600;margin-top:2px;">Find People</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;"><button type="button" style="flex:1;margin:0;padding:7px 10px;font-size:12px;" onclick="openEditModal()" class="btn-edit-pill">Edit Profile</button>
        <input type="file" id="quickAvatarInput" accept="image/*" style="display:none;" onchange="handleQuickAvatarUpload(event)" />
        <button type="button" onclick="document.getElementById('quickAvatarInput').click()" class="btn-photo-bar">Change Photo</button></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
  <button type="button" onclick="toggleProfileDrawer('friendLinkBox')" style="flex:1;margin:0;background:#18181f;border:1px solid #2a2a35;color:#cbd5e1;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;">
    <span>Duo Link (Co-DP)</span><span style="color:#60a5fa;font-size:11px;">&#9662;</span>
  </button>
  <button type="button" onclick="toggleProfileDrawer('moodAuraBox')" style="flex:1;margin:0;background:#18181f;border:1px solid #2a2a35;color:#cbd5e1;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;">
    <span>Mood Aura</span><span style="color:#60a5fa;font-size:11px;">&#9662;</span>
  </button>
</div>
<div class="duo-mem-split">
<div id="friendLinkBox" style="display:none;margin-top:8px;background:#1c1c22;border:1px solid #2e2e36;border-radius:10px;padding:10px;">
        <div style="font-size:12px;color:#a1a1aa;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
          <span>Duo Link (Co-DP)</span>
          <span id="friendLinkStatus" style="color:#00d2ff;font-weight:600;"></span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <input id="friendLinkInput" placeholder="Friend username or email" style="flex:1;min-width:130px;margin:0;padding:7px 9px;font-size:12px;background:#141418;border:1px solid #333;border-radius:7px;color:#fff;" />
          <select id="friendLinkDuration" style="width:auto;margin:0;padding:7px;font-size:12px;background:#141418;border:1px solid #333;border-radius:7px;color:#fff;">
            <option value="1_week">1 Week</option>
            <option value="3_weeks">3 Weeks</option>
            <option value="1_month">1 Month</option>
          </select>
          <button type="button" onclick="saveFriendLink()" style="width:auto;margin:0;padding:7px 12px;font-size:12px;border-radius:7px;">Link</button>
          <button type="button" id="unlinkFriendBtn" onclick="unlinkFriend()" style="display:none;width:auto;margin:0;padding:7px 10px;font-size:12px;border-radius:7px;background:#3f1d24;color:#fda4af;">Unlink</button>
        </div>
      </div>

          <div id="memoriesSection" style="flex:1;min-width:170px;margin:0;background:#1c1c22;border:1px solid #2e2e36;border-radius:12px;padding:12px;">
        <div style="font-size:12px;color:#a1a1aa;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
          <span>Memories</span>
          <span id="memoryCount" style="color:#71717a;"></span>
        </div>
        <div id="memoriesStrip" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;align-items:flex-start;">
          <div onclick="openAddMemoryModal()" style="cursor:pointer;text-align:center;min-width:60px;">
            <div style="width:54px;height:54px;border-radius:50%;border:1.5px dashed #00d2ff;display:flex;align-items:center;justify-content:center;font-size:22px;color:#00d2ff;margin:0 auto 4px;">+</div>
            <div style="font-size:11px;color:#d4d4d8;">New</div>
          </div>
          <div id="memoriesList" style="display:flex;gap:12px;"></div>
        </div>
      </div>
</div>

      </div><!-- End Duo+Memories Side-by-Side Row --><!-- Add Memory Modal -->
      <div id="addMemoryModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:999;align-items:center;justify-content:center;padding:16px;">
        <div style="background:#16161a;border:1px solid #2e2e36;border-radius:16px;padding:18px;width:100%;max-width:360px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <strong style="font-size:15px;">Save a Memory</strong>
            <button type="button" onclick="closeAddMemoryModal()" style="width:auto;background:transparent;color:#aaa;padding:4px 8px;font-size:18px;margin:0;">&#215;</button>
          </div>
          <input type="file" id="memoryFileInput" accept="image/*" style="margin-bottom:10px;font-size:12px;" />
          <input type="text" id="memoryTitleInput" placeholder="Memory title (e.g., Goa Trip, Late Night)" maxlength="60" style="margin-bottom:8px;" />
          <input type="text" id="memoryCaptionInput" placeholder="Short note (optional)" maxlength="220" style="margin-bottom:12px;" />
          <button type="button" id="saveMemoryBtn" onclick="saveNewMemory()">Save to Profile</button>
        </div>
      </div>

      <!-- View Memory Modal -->
      <div id="viewMemoryModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;align-items:center;justify-content:center;padding:16px;">
        <div style="background:#16161a;border:1px solid #2e2e36;border-radius:16px;padding:16px;width:100%;max-width:380px;text-align:center;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div style="text-align:left;">
              <div id="viewMemTitle" style="font-weight:700;font-size:15px;"></div>
              <div id="viewMemDate" style="font-size:11px;color:#888;"></div>
            </div>
            <button type="button" onclick="closeViewMemoryModal()" style="width:auto;background:transparent;color:#aaa;padding:4px 8px;font-size:18px;margin:0;">&#215;</button>
          </div>
          <img id="viewMemImg" src="" style="width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-bottom:10px;" />
          <p id="viewMemCaption" style="font-size:13px;color:#d4d4d8;margin:0 0 12px;"></p>
          <button type="button" id="deleteMemBtn" style="background:#3f1d24;color:#fda4af;font-size:12px;padding:8px;">Delete Memory</button>
        </div>
      </div>

      <!-- Instagram-style Edit Profile Modal -->
    <div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center;padding:16px;">
      <div style="background:#16161a;border:1px solid #2e2e36;border-radius:16px;padding:20px;width:100%;max-width:380px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <strong style="font-size:16px;">Edit Profile</strong>
          <button type="button" onclick="closeEditModal()" style="width:auto;background:transparent;color:#aaa;padding:4px 8px;font-size:18px;">×</button>
        </div>
        <div style="text-align:center;margin-bottom:14px;">
          <img id="editPreview" src="" style="width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--aura-color);" />
          <div style="margin-top:8px;">
            <label for="dpInput" style="color:#38bdf8;font-size:13px;font-weight:600;cursor:pointer;">Change Profile Photo</label>
            <input type="file" id="dpInput" accept="image/*" onchange="previewEditDp(this)" style="display:none;" />
          </div>
        </div>
        <label style="font-size:12px;color:#aaa;">Username</label>
        <input type="text" id="editUsername" placeholder="Username" />
        <label style="font-size:12px;color:#aaa;margin-top:8px;display:block;">Bio</label>
        <textarea id="editBio" rows="3" placeholder="Write a short bio..." style="width:100%;background:#1e1e24;border:1px solid #333;color:#fff;border-radius:8px;padding:10px;margin-top:4px;font-family:inherit;resize:none;"></textarea>
        <button type="button" onclick="saveProfile()" style="margin-top:12px;">Save Changes</button>
        <p id="dpMsg" class="status"></p>
      </div>
    </div>
    <label style="display:block;margin-top:12px;font-size:13px;">Current Vibe / Mood Aura: <strong id="currentMoodLabel" style="color:var(--aura-color);">🌊 Chill</strong></label>
    <div class="mood-bar">
      <button type="button" class="mood-btn" onclick="setMood('chill')">🌊 Chill</button>
      <button type="button" class="mood-btn" onclick="setMood('hyped')">🔥 Hyped</button>
      <button type="button" class="mood-btn" onclick="setMood('focused')">🎯 Focused</button>
      <button type="button" class="mood-btn" onclick="setMood('nostalgic')">📼 Nostalgic</button>
      <button type="button" class="mood-btn" onclick="setMood('night_owl')">🦉 Night Owl</button>
    </div>
      

      <!-- Stories Bar & Upload Story -->
  <!-- Instagram-style Horizontal Stories Strip (DP + Story Merged) -->
  
</div>
<div id="storiesBar" class="stories" style="display:flex;gap:14px;overflow-x:auto;padding:10px 4px;margin-bottom:12px;"></div>
  <input type="file" id="storyInput" accept="image/*" onchange="uploadStory()" style="display:none;" />
  <p id="storyMsg" class="status" style="text-align:center;margin:0 0 8px 0;"></p>

  <!-- Full-Screen Instagram Story Viewer Modal -->
  <div id="storyViewer" onclick="closeStoryViewer()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:1000;flex-direction:column;align-items:center;justify-content:center;padding:16px;">
    <div style="width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <img id="viewerAvatar" src="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--aura-color);" />

  <script>
    const API = "https://momento-a7w2.onrender.com";
    let currentUser = JSON.parse(localStorage.getItem("momento_user") || "null");

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function auth(endpoint) {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("authMsg");
    msg.style.color = "#60a5fa";
    msg.textContent = "Connecting to server (may take ~40s if sleeping)...";
    try {
      const res = await fetch(API + endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password })
      });
      const text = await res.text();
      let data = {};
      try { data = JSON.parse(text); } catch (e) { throw new Error("Server returned HTTP " + res.status + " (not JSON)"); }
      window.activeStories = data.stories || [];
      if (!res.ok) { msg.style.color = "#ff5252"; msg.textContent = data.error || ("Error " + res.status); return; }
      currentUser = data;
      localStorage.setItem("momento_user", JSON.stringify(currentUser));
      initApp();
    } catch (err) {
      msg.style.color = "#ff5252";
      msg.textContent = "Error: " + err.message;
    }
  }

  function openEditModal() {
    if (!currentUser) return;
    document.getElementById("editUsername").value = currentUser.username || "";
    document.getElementById("editBio").value = currentUser.bio || "";
    document.getElementById("editPreview").src = currentUser.profile_pic || "https://placeholder.com";
    document.getElementById("dpInput").value = "";
    document.getElementById("dpMsg").textContent = "";
    document.getElementById("editModal").style.display = "flex";
  }

  function closeEditModal() {
    document.getElementById("editModal").style.display = "none";
  }

  function previewEditDp(input) {
    if (input.files && input.files[0]) {
      document.getElementById("editPreview").src = URL.createObjectURL(input.files[0]);
    }
  }

  async function saveProfile() {
    const msg = document.getElementById("dpMsg");
    const file = document.getElementById("dpInput").files[0];
    const newUsername = document.getElementById("editUsername").value.trim();
    const newBio = document.getElementById("editBio").value.trim();

    let b64 = null;
    if (file) {
      b64 = await toBase64(file);
      currentUser.profile_pic = b64;
    }
    if (newUsername) currentUser.username = newUsername;
    currentUser.bio = newBio;

    localStorage.setItem("momento_user", JSON.stringify(currentUser));
    initApp();
    msg.style.color = "#4ade80";
    msg.textContent = "Saved!";
    setTimeout(closeEditModal, 250);

    const payload = { email: currentUser.email, username: currentUser.username, bio: newBio };
    if (b64) payload.profile_pic = b64;

    fetch(API + "/api/update-dp/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(r => r.ok ? r.json() : null).then(data => {
      if (data && data.profile_pic) {
        currentUser.profile_pic = data.profile_pic;
        localStorage.setItem("momento_user", JSON.stringify(currentUser));
        initApp();
      }
    }).catch(() => {});
  }

  function compressImage(file, maxW = 900) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.78));
      };
      img.src = URL.createObjectURL(file);
    });
  }

  async function uploadStory() {
    const input = document.getElementById("storyInput");
    const file = input.files && input.files[0] ? input.files[0] : null;
    if (!file) return;

    const localStoryUrl = URL.createObjectURL(file);
    window.activeStories = [
      { username: currentUser.username, image_url: localStoryUrl, author_dp: currentUser.profile_pic },
      ...(window.activeStories || [])
    ];

    const myDpEl = document.getElementById("userDp");
    if (myDpEl) {
      myDpEl.style.outline = "3px solid #f59e0b";
      myDpEl.style.outlineOffset = "2px";
    }

    const sMsg = document.getElementById("storyMsg");
    if (sMsg) {
      sMsg.style.color = "#4ade80";
      sMsg.textContent = "Story live! Tap your DP to view.";
      setTimeout(() => { sMsg.textContent = ""; }, 2000);
    }

    input.value = "";
    const smallB64 = await compressImage(file, 900);
    fetch(API + "/api/stories/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: currentUser.email, image: smallB64 })
    }).catch(() => {});
  }

      let currentCreateType = "post";

  function previewPostMedia(input) {
    const f = input.files && input.files.length ? input.files.item(0) : null;
    if (!f) return;
    const url = URL.createObjectURL(f);
    document.getElementById("mediaPreviewBox").style.display = "block";

      const v = document.getElementById("postVidPreview");
      v.src = url;
      v.style.display = "block";

    } else {
      const img = document.getElementById("postImgPreview");
      img.src = url;
      img.style.display = "block";

  async function uploadPost() {
    const input = document.getElementById("postInput");
    const file = input.files && input.files.length ? input.files.item(0) : null;
    if (!file) return;
    const caption = document.getElementById("postCaption").value.trim();
    const localUrl = URL.createObjectURL(file);
    const feedList = document.getElementById("feedList");

    const mediaHtml = currentCreateType === "reel"
      ? `<video src="${localUrl}" controls playsinline loop style="width:100%;border-radius:10px;margin-top:10px;max-height:420px;background:#000;"></video>`
      : `<img class="post-img" src="${localUrl}" />`;

    const badge = currentCreateType === "reel"
      ? `<span style="margin-left:auto;font-size:11px;background:#8b5cf6;color:#fff;padding:2px 8px;border-radius:99px;">🎬 Reel</span>`
      : ``;

    const cardHtml = renderPostCard({
      id: "local_" + Date.now(),
      username: currentUser.username,
      author_dp: currentUser.profile_pic,
      image_url: localUrl,
      caption: caption,
      isReel: currentCreateType === "reel",
      likes: 0,
      comments: []
    });
    if (feedList) feedList.insertAdjacentHTML("afterbegin", cardHtml);

    const msg = document.getElementById("postMsg");
    msg.style.color = "#4ade80";
    msg.textContent = currentCreateType === "reel" ? "Reel shared!" : "Post shared!";
    setTimeout(closeCreateComposer, 250);
    navHome();

    if (currentCreateType === "post") {
      const smallB64 = await compressImage(file, 900);
      fetch(API + "/api/posts/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: currentUser.email, image: smallB64, caption })
      }).catch(() => {});
    }
  }
    function renderPostCard(post) {
    const pid = post.id;
    const badge = post.isReel
      ? `<span style="margin-left:auto;font-size:11px;background:#8b5cf6;color:#fff;padding:2px 8px;border-radius:99px;">🎬 Reel</span>`
      : ``;
    const mediaTag = post.isReel
      ? `<video src="${post.image_url}" controls playsinline loop style="width:100%;border-radius:10px;margin-top:10px;max-height:420px;background:#000;"></video>`
      : `<img class="post-img" src="${post.image_url}" />`;

    const existingComments = (post.comments || []).map(c =>
      `<div style="font-size:13px;margin-top:4px;"><strong>${c.username || "user"}</strong> <span style="color:#d1d5db;">${c.text}</span></div>`
    ).join("");

    return `
      <div class="card" id="card_${pid}">
        <div class="row">
          <img class="avatar" style="width:36px;height:36px;" src="${post.author_dp || 'https://placeholder.com'}" />
          <strong>${post.username}</strong>
          ${badge}
        </div>
        <div style="position:relative;user-select:none;" ondblclick="doubleTapLike('${pid}')">
          ${mediaTag}
          <div id="heart_${pid}"></div>
        </div>
        <div style="display:flex;align-items:center;gap:14px;margin-top:10px;">
          <button type="button" id="likeBtn_${pid}" onclick="toggleLike('${pid}')" data-liked="0" style="width:auto;background:transparent;padding:4px 6px;margin:0;font-size:20px;">🤍</button>
          <button type="button" onclick="toggleComments('${pid}')" style="width:auto;background:transparent;padding:4px 6px;margin:0;font-size:19px;">💬</button>
        </div>
        <div style="font-size:13px;font-weight:600;margin-top:4px;"><span id="likeCount_${pid}">${post.likes || 0}</span> likes</div>
        ${post.caption ? `<p style="margin:6px 0;"><strong>${post.username}</strong> ${post.caption}</p>` : ""}
        <div id="commentsBox_${pid}" style="margin-top:8px;border-top:1px solid #26262e;padding-top:8px;">
          <div id="commentsList_${pid}">${existingComments}</div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <input id="commentInput_${pid}" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')addComment('${pid}')" style="margin:0;padding:8px 10px;font-size:13px;" />
            <button type="button" onclick="addComment('${pid}')" style="width:auto;margin:0;padding:8px 14px;font-size:13px;background:#0095f6;">Post</button>
          </div>
        </div>
      </div>
    `;
  }

  function toggleLike(pid, forceLike = false) {
    const btn = document.getElementById("likeBtn_" + pid);
    const cnt = document.getElementById("likeCount_" + pid);
    if (!btn || !cnt) return;
    const isLiked = btn.getAttribute("data-liked") === "1";
    let num = parseInt(cnt.textContent || "0", 10);

    if (!isLiked) {
      btn.setAttribute("data-liked", "1");
      btn.textContent = "â¤ï¸";
      cnt.textContent = num + 1;
    } else if (!forceLike) {
      btn.setAttribute("data-liked", "0");
      btn.textContent = "ðŸ¤";
      cnt.textContent = Math.max(0, num - 1);
    }
  }

  function doubleTapLike(pid) {
    toggleLike(pid, true);
    const holder = document.getElementById("heart_" + pid);
    if (!holder) return;
    holder.innerHTML = `<div class="heart-burst">â¤ï¸</div>`;
    setTimeout(() => { holder.innerHTML = ""; }, 780);
  }

  function toggleComments(pid) {
    const inp = document.getElementById("commentInput_" + pid);
    if (inp) inp.focus();
  }

  function addComment(pid) {
    const inp = document.getElementById("commentInput_" + pid);
    const list = document.getElementById("commentsList_" + pid);
    if (!inp || !list) return;
    const text = inp.value.trim();
    if (!text) return;
    const who = (currentUser && currentUser.username) ? currentUser.username : "you";
    list.insertAdjacentHTML("beforeend", `<div style="font-size:13px;margin-top:4px;"><strong>${who}</strong> <span style="color:#d1d5db;">${text}</span></div>`);
    inp.value = "";
  }

function renderLinkedFriendUI(lf) {
    const badge = document.getElementById("friendDpBadge");

    const unlinkBtn = document.getElementById("unlinkFriendBtn");
    if (!badge) return;
    if (lf) {

      const svg = `<svg xmlns="http://w3.org" width="64" height="64"><rect width="64" height="64" rx="32" fill="#4f46e5"/><text x="32" y="42" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-weight="bold" font-size="28">${initial}</text></svg>`;
      const fallbackSvg = "data:image/svg+xml;base64," + btoa(svg);
      const isDefault = !lf.dp || lf.dp.includes("default.jpg");
      const dpSrc = isDefault ? fallbackSvg : (lf.dp.startsWith("http") ? lf.dp : (API + lf.dp));
      badge.onerror = () => { badge.onerror = null; badge.src = fallbackSvg; };
      badge.src = dpSrc;
      badge.style.display = "inline-block";
      if (status && lf.expires_at) {
        const msLeft = new Date(lf.expires_at).getTime() - Date.now();
        const daysLeft = Math.max(1, Math.ceil(msLeft / (1000 * 60 * 60 * 24)));
        const streakTxt = " \u2022 \uD83D\uDD25 " + (lf.duo_streak || 0) + "d streak";
        status.textContent = "@" + (lf.username || lf.email) + " (" + daysLeft + "d left)" + streakTxt;
      }
      if (unlinkBtn) unlinkBtn.style.display = "inline-block";
    } else {
      badge.style.display = "none";
      if (status) status.textContent = "";
      if (unlinkBtn) unlinkBtn.style.display = "none";
    }
  }

// Live Location Detection at Top of Profile (Fast City, State, Country)
async function detectUserLocation(forceRefresh = false) {
  const locEl = document.getElementById("locationText");
  if (!locEl) return;
  const saved = localStorage.getItem("momento_location");
  if (saved && !saved.match(/^\d+\.\d+/) && !forceRefresh) { locEl.textContent = saved; return; }
  locEl.textContent = "Finding city...";
  async function fallbackIpLocation() {
    try {
      const r = await fetch("https://bigdatacloud.net");
      if (r.ok) {
        const d = await r.json();
        const place = [d.city || d.locality, d.principalSubdivision, d.countryName].filter(Boolean).join(", ");
        if (place) { locEl.textContent = place; localStorage.setItem("momento_location", place); return; }
      }
    } catch (e) {}
    locEl.textContent = "Baranagar, West Bengal, India";
  }
  if (!navigator.geolocation) { fallbackIpLocation(); return; }
  let settled = false;
  const timer = setTimeout(() => { if (!settled) { settled = true; fallbackIpLocation(); } }, 4000);
  navigator.geolocation.getCurrentPosition(
    async function(pos) {
      if (settled) return;
      settled = true; clearTimeout(timer);
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      try {
        const bdcUrl = "https://bigdatacloud.net" + lat + "&longitude=" + lon + "&localityLanguage=en";
        const bdcRes = await fetch(bdcUrl);
        if (bdcRes.ok) {
          const bdc = await bdcRes.json();
          const placeName = [bdc.city || bdc.locality, bdc.principalSubdivision, bdc.countryName].filter(Boolean).join(", ");
          if (placeName) { locEl.textContent = placeName; localStorage.setItem("momento_location", placeName); return; }
        }
      } catch (e) {}
      fallbackIpLocation();
    },
    function() {
      if (!settled) { settled = true; clearTimeout(timer); fallbackIpLocation(); }
    },
    { enableHighAccuracy: false, timeout: 4000, maximumAge: 600000 }
  );
}
const _prevInitAppLoc = initApp;
initApp = function() {
  _prevInitAppLoc();
  detectUserLocation(false);
};

<script>
async function loadFollowCounts() {
  if (typeof currentUser === 'undefined' || !currentUser || !currentUser.email) return;
  try {
    const res = await fetch(API + "/api/follow/list/?email=" + encodeURIComponent(currentUser.email));
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('statFollowersCount').textContent = data.followers_count ?? 0;
    document.getElementById('statFollowingCount').textContent = data.following_count ?? 0;
  } catch (e) {}
}
function openFollowModal(tab) {
  document.getElementById('momentoFollowModal').style.display = 'flex';
  switchFollowTab(tab || 'followers');
}
function closeFollowModal() {
  document.getElementById('momentoFollowModal').style.display = 'none';
}
function switchFollowTab(tab) {
  ['followers', 'following', 'discover'].forEach(t => {
    const btn = document.getElementById('tabBtn' + t.charAt(0).toUpperCase() + t.slice(1));
    if (btn) { btn.style.background = (t === tab) ? '#2563eb' : '#262630'; btn.style.color = (t === tab) ? '#fff' : '#9ca3af'; }
  });
  document.getElementById('followSearchBoxWrap').style.display = (tab === 'discover') ? 'block' : 'none';
  if (tab === 'discover') searchDiscoverUsers(document.getElementById('followSearchInput').value || '');
  else renderFollowList(tab);
}
async function renderFollowList(tab) {
  const body = document.getElementById('followModalBody');
  if (!body || !currentUser?.email) return;
  body.innerHTML = '<div style="text-align:center;color:#9ca3af;font-size:13px;padding:20px 0;">Loading...</div>';
  const res = await fetch(API + "/api/follow/list/?email=" + encodeURIComponent(currentUser.email));
  const data = await res.json();
  document.getElementById('statFollowersCount').textContent = data.followers_count ?? 0;
  document.getElementById('statFollowingCount').textContent = data.following_count ?? 0;
  const list = tab === 'followers' ? (data.followers || []) : (data.following || []);
  renderUserCards(list, tab === 'followers' ? 'No followers yet. Tap Discover to connect!' : 'You are not following anyone yet.');
}
async function searchDiscoverUsers(q) {
  const body = document.getElementById('followModalBody');
  if (!body || !currentUser?.email) return;
  body.innerHTML = '<div style="text-align:center;color:#9ca3af;font-size:13px;padding:20px 0;">Searching...</div>';

  renderUserCards(data.users || [], 'No other users found.');

function renderUserCards(users, emptyMsg) {

  btn.disabled = true;

    const res = await fetch(API + "/api/follow/toggle/", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: currentUser.email, target_id: targetId })

    if (res.ok) {

      btn.style.border = data.following ? '1px solid #3f3f46' : 'none';
